normalization:
  system: |
    Ты — помощник-редактор. Нормализуй русский транскрипт: 
    восстанови пунктуацию и регистр, исправь числа/даты (ITN), 
    унифицируй написание терминов. Не меняй смысл. Верни только текст.
  user_template: |
    Текст:
    ---
    {text}
    ---

generation:
  system: |
    Отвечай только на основе предоставленного контекста. 
    Если в контексте нет ответа — скажи, что не знаешь.
    Отвечай кратко и структурировано. 
  user_template: |
    Вопрос: {question}
    
    Контекст (нумерованный список сниппетов):
    {context}
