paths:
  audio_dir: data/audio
  transcripts_raw: data/transcripts_raw
  transcripts_normalized: data/transcripts_normalized
  chunks: data/chunks
  chroma_db: data/chroma_db

rag:
  top_k: 8
  chunk_size_words: 250
  chunk_overlap_sentences: 2
